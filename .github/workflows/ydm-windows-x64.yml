name: YDM Windows x64 build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "gframe/**"
      - "ocgcore"
      - "travis/**"
      - "irrlicht/**"
      - "premake5.lua"
      - ".github/workflows/ydm-windows-x64.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      TRAVIS_OS_NAME: windows
      TARGET_OS: windows
      ARCH: x64
      BUILD_CONFIG: Release
      VS_GEN: vs2022
      SERVER_URL: 127.0.0.1
      DXSDK_DIR: C:/d3d9sdk/
      VCPKG_ROOT: C:/vcpkg
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      - name: Install local client dependencies
        shell: bash
        run: |
          ./travis/install-local-dependencies.sh
          ./travis/get-windows-d3d9sdk.sh

      - name: Install x64 vcpkg dependencies
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
          & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          & C:\vcpkg\vcpkg.exe install fmt curl freetype sqlite3 libevent libgit2 libssh2 openssl libpng bzip2 zlib libjpeg-turbo --triplet x64-windows-static --host-triplet x64-windows ffmpeg:x64-windows
          & C:\vcpkg\vcpkg.exe integrate install

      - name: Stage FFmpeg headers, import libraries and runtime DLLs
        shell: pwsh
        run: |
          $root = "C:\\vcpkg\\installed\\x64-windows"
          $destination = "ffmpeg"
          New-Item -ItemType Directory -Force -Path "$destination/include", "$destination/lib", "$destination/bin" | Out-Null
          $headers = @("libavcodec", "libavdevice", "libavfilter", "libavformat", "libavutil", "libswresample", "libswscale")
          foreach ($name in $headers) {
            Copy-Item -Path "$root/include/$name" -Destination "$destination/include" -Recurse -Force
          }
          $libraries = @("avcodec.lib", "avdevice.lib", "avfilter.lib", "avformat.lib", "avutil.lib", "swresample.lib", "swscale.lib")
          foreach ($name in $libraries) {
            Copy-Item -Path "$root/lib/$name" -Destination "$destination/lib" -Force
          }
          Get-ChildItem "$root/bin/*.dll" | Copy-Item -Destination "$destination/bin" -Force
          if (-not (Test-Path "$destination/include/libavcodec/avcodec.h")) { throw "FFmpeg headers are missing" }
          if (-not (Test-Path "$destination/lib/avcodec.lib")) { throw "FFmpeg import library is missing" }
      - name: Build matching client and core
        shell: bash
        run: |
          ./travis/install-premake5.sh
          ./travis/build.sh

      - name: Package Windows x64 client
        shell: bash
        run: ./travis/predeploy.sh windows

      - uses: actions/upload-artifact@v4
        with:
          name: YDM-EDOPro-Windows-x64
          path: deploy/
          if-no-files-found: error
